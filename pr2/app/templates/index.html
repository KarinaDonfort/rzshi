<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Детекція обʼєктів</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 44rem; margin: 3rem auto; padding: 0 1rem; }
    form { display: flex; gap: .5rem; align-items: center; margin: 1.5rem 0; flex-wrap: wrap; }
    button { padding: .5rem 1rem; font-size: 1rem; cursor: pointer; }
    label { font-size: .9rem; color: #555; display: flex; align-items: center; gap: .3rem; }
    #result { min-height: 3rem; white-space: pre-wrap; }
    .error { color: #b00020; }
    .summary { font-weight: bold; margin-bottom: .5rem; }
    table { border-collapse: collapse; width: 100%; font-size: .95rem; }
    th, td { border: 1px solid #ddd; padding: .35rem .5rem; text-align: left; }
    th { background: #f5f5f5; }
    .empty { color: #777; font-style: italic; }
  </style>
</head>
<body>
  <h1>Детекція обʼєктів</h1>

  <form id="detect-form">
    <input id="image" type="file" name="image" accept="image/*" required>
    <label>
      Поріг:
      <input id="confidence" type="number" min="0" max="1" step="0.05" value="0.25" style="width: 5rem;">
    </label>
    <button type="submit">Знайти обʼєкти</button>
  </form>

  <div id="result"></div>

  <script>
    const form = document.getElementById('detect-form');
    const result = document.getElementById('result');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const file = document.getElementById('image').files[0];
      if (!file) return;

      const confidence = document.getElementById('confidence').value;
      const data = new FormData();
      data.append('image', file);

      result.className = '';
      result.textContent = 'Обробка…';

      try {
        const url = '/api/detect?confidence=' + encodeURIComponent(confidence);
        const response = await fetch(url, { method: 'POST', body: data });
        const payload = await response.json();

        if (!response.ok) {
          result.className = 'error';
          result.textContent = 'Помилка: ' + (payload.error || 'Невідома помилка');
          return;
        }

        result.className = '';
        if (payload.count === 0) {
          result.innerHTML =
            `<div class="summary">Обʼєктів не знайдено (поріг ${payload.confidence_threshold}).</div>` +
            `<div class="empty">Час inference: ${payload.inference_ms} мс</div>`;
          return;
        }

        const rows = payload.detections.map(d => {
          const b = d.box;
          return `<tr>
            <td>${d.class}</td>
            <td>${d.confidence}</td>
            <td>${b.x1}, ${b.y1}, ${b.x2}, ${b.y2}</td>
          </tr>`;
        }).join('');

        result.innerHTML =
          `<div class="summary">Знайдено обʼєктів: ${payload.count} ` +
          `(поріг ${payload.confidence_threshold}, ${payload.inference_ms} мс)</div>` +
          `<table>
            <thead><tr><th>Клас</th><th>Confidence</th><th>Рамка (x1, y1, x2, y2)</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>`;
      } catch (error) {
        result.className = 'error';
        result.textContent = 'Не вдалося звернутися до сервера.';
      }
    });
  </script>
</body>
</html>
