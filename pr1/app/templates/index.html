<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Погода</title>

  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 32rem;
      margin: 3rem auto;
      padding: 0 1rem;
    }

    form {
      display: flex;
      gap: .5rem;
      margin: 1.5rem 0;
    }

    input {
      flex: 1;
      padding: .5rem;
      font-size: 1rem;
    }

    button {
      padding: .5rem 1rem;
      font-size: 1rem;
      cursor: pointer;
    }

    #result {
      min-height: 3rem;
      white-space: pre-wrap;
    }

    .error {
      color: #b00020;
    }
  </style>
</head>

<body>
  <h1>Погода</h1>

  <form id="weather-form">
    <input
      id="city"
      name="city"
      placeholder="Назва міста"
      autocomplete="off"
      required
    >
    <button type="submit">Показати</button>
  </form>

  <div id="result"></div>

  <script>
    const form = document.getElementById('weather-form');
    const result = document.getElementById('result');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();

      const city = document.getElementById('city').value.trim();

      result.className = '';
      result.textContent = 'Запит…';

      if (!city) {
        result.className = 'error';
        result.textContent = 'Введіть назву міста.';
        return;
      }

      try {
        const response = await fetch(
          '/api/weather?city=' + encodeURIComponent(city)
        );

        const data = await response.json();

        if (!response.ok) {
          result.className = 'error';
          result.textContent =
            'Помилка: ' + (data.error || data.detail || 'Невідома помилка');
          return;
        }

        result.textContent =
          `Місто: ${data.city}\n` +
          `Температура: ${data.temperature} ${data.temperature_unit}\n` +
          `Швидкість вітру: ${data.wind_speed} ${data.wind_speed_unit}`;

      } catch (error) {
        result.className = 'error';
        result.textContent = 'Не вдалося звернутися до сервера.';
      }
    });
  </script>
</body>
</html>
